name: Compilar o mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Compilar
        run: gradle build

      - name: Guardar o mod pronto
        uses: actions/upload-artifact@v4
        with:
          name: clear-portals-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
